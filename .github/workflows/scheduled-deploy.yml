name: Scheduled Vercel Deploy

on:
  schedule:
    # 매일 한국시간 오전 9시, 저녁 9시 (UTC 00:00, 12:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST -f "${{ secrets.VERCEL_DEPLOY_HOOK }}"
